<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Access Suspended</title>

<!-- Favicons -->
<link rel="icon" href="/img/icon.png">
<link rel="apple-touch-icon" href="/img/app-icon.png">

<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2TKPQV995W"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-2TKPQV995W');
</script>
<script src="/js/analytics.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');

*,*::before,*::after{
  box-sizing:border-box;
}

:root{
  --red:#BB001E;
  --red-h:#d10022;
  --red-glow:rgba(187,0,30,0.35);
  --font:'Patrick Hand',cursive;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:var(--font);
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

/* Offline Banner */
#offlineBanner {
  position: fixed; top: 0; left: 0; width: 100%; background: #ef4444; color: #fff;
  text-align: center; padding: 10px; font-family: var(--font); font-size: 18px;
  z-index: 10000; transform: translateY(-100%); transition: transform 0.3s ease;
}
#offlineBanner.show { transform: translateY(0); }

/* animations */
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
@keyframes popIn{ from{opacity:0; transform:scale(.92) translateY(14px);} to{opacity:1; transform:scale(1) translateY(0);} }

/* CARD */
.card{
  width:min(560px,100%);
  background:rgba(20,0,0,0.97);
  border:3px solid #ff3333;
  border-radius:28px;
  padding:40px 30px;
  text-align:center;
  animation:fadeIn .25s ease, popIn .3s ease;
  box-shadow: 0 0 50px rgba(255,51,51,0.2);
}

.error-icon{
  width: 90px;
  height: 90px;
  fill: #ff3333;
  margin: 0 auto 15px;
  filter: drop-shadow(0 0 15px rgba(255,51,51,0.5));
}

.title{
  font-size:42px;
  margin:10px 0 12px;
  color: #ff3333;
}

.desc{
  font-size:22px;
  color:rgba(255,255,255,0.75);
  line-height:1.5;
  margin:0 0 24px;
}

.btn {
  display: inline-block; font-family: var(--font); font-size: 19px;
  padding: 10px 18px; border-radius: 12px; border: 2px solid var(--red);
  background: var(--red); color: #fff; cursor: pointer;
  transition: transform .15s, background .15s, box-shadow .15s, border-color .15s;
  text-decoration: none; text-align: center; line-height: 1.2; width: auto;
}
.btn:hover { background: var(--red-h); transform: scale(1.03); box-shadow: 0 4px 18px var(--red-glow); }
.btn:active { transform: scale(.97); }

@media(max-width:600px){
  .title{font-size:34px;}
  .desc{font-size:19px;}
}
</style>
</head>

<body>

<div id="offlineBanner">You are currently offline</div>

<div class="card">
  <svg class="error-icon" viewBox="0 0 24 24">
    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
  </svg>

  <div class="title">Access Suspended</div>

  <p class="desc">
    Your device or account has been permanently banned from the BSMS Web ecosystem due to violations of our policies.
  </p>
  
  <a href="/" class="btn" data-ga="banned_home_btn">Go Back Home</a>
</div>

<script>
/*
 * BSMS Web
 * Copyright © 2026 Jellyfish Jelly
 * SPDX-License-Identifier: MIT
 */
window.addEventListener('offline', () => document.getElementById('offlineBanner').classList.add('show'));
window.addEventListener('online', () => document.getElementById('offlineBanner').classList.remove('show'));
if (!navigator.onLine) document.getElementById('offlineBanner').classList.add('show');
</script>

</body>
</html>
