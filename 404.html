<style>
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');

*, *::before, *::after {
    box-sizing: border-box;
}

:root {
    --red: #BB001E;
    --red-bright: #e00025;
    --dark: #0a0405;
    --bg-dots: rgba(187, 0, 30, 0.25);
    --font: 'Patrick Hand', cursive;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--dark);
    color: #fff;
    font-family: var(--font);
}

body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;

    /* A playful red comic halftone dot pattern fitting "Patrick Hand" perfectly! */
    background-image: radial-gradient(var(--bg-dots) 2px, transparent 2.5px),
                      radial-gradient(var(--bg-dots) 2px, transparent 2.5px);
    background-size: 35px 35px;
    background-position: 0 0, 17.5px 17.5px;
    
    transition: filter 0.1s;
}

/* =========================================
   OFFLINE BANNER (SKETCHY CLIP)
   ========================================= */

#offlineBanner {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 12px 16px 24px 16px;
    background: var(--red-bright);
    color: #fff;
    text-align: center;
    font-size: 24px;
    z-index: 10000;
    
    /* Drawn shape clipping to match the font! */
    clip-path: polygon(0 0, 100% 0, 100% 70%, 97% 95%, 65% 82%, 25% 100%, 0% 78%);
    transform: translateY(-100%);
    transition: transform .4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

#offlineBanner.show {
    transform: translateY(0);
}

/* =========================================
   COMIC ERROR CARD DESIGN
   ========================================= */

.error-wrapper {
    position: relative;
    z-index: 5;
    width: min(700px, 90vw);
    pointer-events: none;
    animation: contentFadeIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.1) both;
}

.error-content {
    background: #0f0a0a;
    border: 5px solid var(--red);
    border-radius: 18px;
    padding: 60px 40px;
    text-align: center;
    box-shadow: 15px 15px 0px rgba(187, 0, 30, 0.4), inset -6px -6px 0px rgba(0,0,0,0.4);
    transform-origin: center bottom;
    transition: transform 0.1s;
}

.error-code {
    margin: 0;
    font-size: clamp(100px, 15vw, 160px);
    line-height: .9;
    letter-spacing: 5px;
    color: transparent;
    display: inline-block;
    filter: drop-shadow(4px 4px 0px #fff);
}

.digit {
    display: inline-block;
    color: var(--red);
    text-shadow: -3px 3px 0 var(--dark), 2px -2px 0 var(--red-bright);
}

.digit-1 { animation: wibbleWobble 2.3s infinite ease-in-out; }
.digit-2 { animation: wibbleWobble 2.6s infinite ease-in-out alternate-reverse; animation-delay: 0.1s; }
.digit-3 { animation: wibbleWobble 2.4s infinite ease-in-out; animation-delay: 0.25s; }

.title {
    margin-top: 35px;
    font-size: clamp(38px, 6vw, 56px);
    line-height: 1;
    color: #fff;
    text-transform: uppercase;
    text-shadow: 3px 3px 0px var(--red);
    transform: rotate(-1.5deg);
}

.desc {
    max-width: 480px;
    margin: 22px auto 0;
    color: #ffdcdb;
    font-size: clamp(20px, 3vw, 24px);
    line-height: 1.35;
    background: rgba(187, 0, 30, 0.2);
    padding: 10px 18px;
    border-radius: 6px;
    border: 2px dashed rgba(255,255,255,0.1);
    transform: rotate(0.8deg);
}

.btn-wrapper {
    margin-top: 40px;
    transform: rotate(-1.5deg);
    display: inline-block;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 14px 28px;
    background: #fff;
    border: 3px solid #000;
    border-radius: 8px;
    color: var(--dark);
    font-family: var(--font);
    font-size: 26px;
    font-weight: 700;
    text-decoration: none;
    pointer-events: auto;
    box-shadow: 6px 6px 0px var(--red);
    transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.15s;
}

.btn:hover {
    transform: translateY(-5px) translateX(-5px) rotate(2deg);
    background: var(--red-bright);
    color: #fff;
    box-shadow: 12px 12px 0px rgba(0,0,0,1);
    border-color: #fff;
}

.btn:active {
    transform: translate(2px, 2px) rotate(0);
    box-shadow: 2px 2px 0px var(--red);
}

/* =========================================
   BOUNCING BULLDOG
   ========================================= */

.dvd-logo {
    position: fixed;
    top: 0;
    left: 0;
    object-fit: contain;
    z-index: 20;
    pointer-events: auto;
    user-select: none;
    cursor: crosshair; /* Begs to be clicked! */
    will-change: transform, filter;
    transition: filter .18s ease;
}

/* =========================================
   ANIMATIONS
   ========================================= */

@keyframes contentFadeIn {
    0% { opacity: 0; transform: scale(0.85) rotate(-3deg); }
    70% { transform: scale(1.02) rotate(1deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
}

@keyframes wibbleWobble {
    0%, 100% { transform: translateY(0px) rotate(-3deg) scale(1); }
    50% { transform: translateY(-12px) rotate(3deg) scale(1.05); }
}

/* =========================================
   INSANE SUPER SHAKE MODE
   ========================================= */

body.chaos-mode {
    animation: intenseChaosShake 0.1s infinite !important;
}

body.chaos-mode::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle, transparent 20%, rgba(187, 0, 30, 0.5) 100%);
    mix-blend-mode: color-dodge;
    pointer-events: none;
    z-index: 100;
}

@keyframes intenseChaosShake {
    0%   { transform: translate(0, 0) rotate(0deg) scale(1); filter: invert(0) saturate(1); }
    20%  { transform: translate(-30px, 15px) rotate(-4deg) scale(1.1); filter: hue-rotate(60deg) invert(1) saturate(3); }
    40%  { transform: translate(30px, -20px) rotate(3deg) scale(0.9); filter: blur(3px) invert(0); }
    60%  { transform: translate(-15px, 35px) rotate(5deg) scale(1.05); filter: hue-rotate(-90deg) invert(1) drop-shadow(0 0 50px red); }
    80%  { transform: translate(25px, 20px) rotate(-6deg) scale(0.95); filter: contrast(3) saturate(1.5) blur(1px); }
    100% { transform: translate(0, 0) rotate(0deg) scale(1); filter: invert(0); }
}

/* =========================================
   RESPONSIVE
   ========================================= */
@media (max-width: 600px) {
    .error-content { padding: 40px 25px; box-shadow: 10px 10px 0 var(--red); }
    .title { margin-top: 25px; transform: none;}
    .desc { margin-top: 15px; }
    .btn-wrapper { margin-top: 25px; transform: none; }
}

@media (max-height: 600px) {
    .error-content { padding: 30px 25px; }
    .error-code { font-size: 85px; letter-spacing: -2px; }
    .title { margin-top: 20px; font-size: 34px; }
    .desc { font-size: 18px; padding: 6px; }
}

@media (prefers-reduced-motion: reduce) {
    .error-wrapper { animation: none; }
    .digit { animation: none !important; transform: none !important;}
    .btn, .dvd-logo { transition: none; }
    body.chaos-mode { animation: none !important; filter: none !important; }
}
</style>

</head>

<body>

<div id="offlineBanner">
    Dang! You are currently offline ✂️
</div>

<div class="error-wrapper">
    <main class="error-content">
        
        <h1 class="error-code">
            <span class="digit digit-1">4</span>
            <span class="digit digit-2">0</span>
            <span class="digit digit-3">4</span>
        </h1>
        
        <div class="title">
            Page Not Found
        </div>
        
        <p class="desc">
            The page you're looking for was mysteriously swallowed by the void,
            or it never even existed to begin with...
        </p>
        
        <div class="btn-wrapper">
            <a
                href="/"
                class="btn"
                data-ga="404_home_btn"
            >
                Escape to Home!
            </a>
        </div>
        
    </main>
</div>

<script>

/* =========================================
   OFFLINE STATUS
   ========================================= */

const offlineBanner = document.getElementById('offlineBanner');

window.addEventListener('offline', () => { offlineBanner.classList.add('show'); });
window.addEventListener('online', () => { offlineBanner.classList.remove('show'); });
if (!navigator.onLine) { offlineBanner.classList.add('show'); }

/* =========================================
   SESSION ID
   ========================================= */

if (!localStorage.getItem('session_id')) {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    let sid = '';
    for (let i = 0; i < 10; i++) {
        sid += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    localStorage.setItem('session_id', sid);
    console.log('[BSMS Web :: System] Generated new session_id.');
}

/* =========================================
   COLOR SYSTEM
   ========================================= */

const tints = [
    `saturate(1.18) contrast(1.04) hue-rotate(0deg) drop-shadow(0 0 8px rgba(187, 0, 30, .40)) drop-shadow(0 0 18px rgba(187, 0, 30, .16))`,
    `saturate(1.20) contrast(1.04) hue-rotate(18deg) drop-shadow(0 0 8px rgba(255, 125, 35, .42)) drop-shadow(0 0 18px rgba(255, 125, 35, .16))`,
    `saturate(1.20) contrast(1.04) hue-rotate(38deg) drop-shadow(0 0 8px rgba(255, 210, 40, .42)) drop-shadow(0 0 18px rgba(255, 210, 40, .16))`,
    `saturate(1.18) contrast(1.04) hue-rotate(85deg) drop-shadow(0 0 8px rgba(45, 205, 100, .40)) drop-shadow(0 0 18px rgba(45, 205, 100, .15))`,
    `saturate(1.20) contrast(1.04) hue-rotate(175deg) drop-shadow(0 0 8px rgba(40, 115, 255, .42)) drop-shadow(0 0 18px rgba(40, 115, 255, .16))`,
    `saturate(1.20) contrast(1.04) hue-rotate(260deg) drop-shadow(0 0 8px rgba(165, 70, 255, .42)) drop-shadow(0 0 18px rgba(165, 70, 255, .16))`,
    `saturate(1.20) contrast(1.04) hue-rotate(315deg) drop-shadow(0 0 8px rgba(255, 70, 160, .42)) drop-shadow(0 0 18px rgba(255, 70, 160, .16))`
];

function createColorBag() {
    let bag = [0, 1, 2, 3, 4, 5, 6];
    for (let i = bag.length - 1; i > 0; i--) {
        const randomIndex = Math.floor(Math.random() * (i + 1));
        [bag[i], bag[randomIndex]] = [bag[randomIndex], bag[i]];
    }
    return bag;
}

const COLOR_CHANGE_COOLDOWN = 450;
const bulldogs = [];
const MAX_BULLDOGS = 75;

/* =========================================
   BULLDOG LOGIC
   ========================================= */

function applyTint(b) {
    b.el.style.filter = tints[b.tintIndex];
}

function changeTint(b, currentTime) {
    if (currentTime - b.lastColorChange < COLOR_CHANGE_COOLDOWN) return;

    if (b.colorBag.length === 0) {
        b.colorBag = createColorBag();
        
        // BUGFIX: Prevent the exact identical color jumping into the front of the next cycle
        if (b.colorBag[0] === b.tintIndex) {
            let temp = b.colorBag[0];
            b.colorBag[0] = b.colorBag[b.colorBag.length - 1];
            b.colorBag[b.colorBag.length - 1] = temp;
        }
    }

    b.tintIndex = b.colorBag.shift();
    applyTint(b);
    b.lastColorChange = currentTime;
}

function spawnBulldog(startX, startY, velocityX, velocityY, clickDelaySpawn = false) {
    if(bulldogs.length >= MAX_BULLDOGS) return;

    const isMobile = window.innerWidth <= 600;
    const wSize = isMobile ? 68 : 92;

    const el = document.createElement('img');
    el.className = 'dvd-logo';
    el.src = '/img/icon.png';
    el.setAttribute('aria-hidden', 'true');
    el.style.width = wSize + "px";
    el.style.height = wSize + "px";
    
    // Send depth index up rapidly if spawned crazily!
    el.style.zIndex = 20 + bulldogs.length; 

    document.body.appendChild(el);

    const bConfig = {
        el,
        x: startX,
        y: startY,
        w: wSize,
        h: wSize,
        vx: velocityX,
        vy: velocityY,
        colorBag: createColorBag(),
        tintIndex: 0,
        lastColorChange: performance.now()
    };
    
    bConfig.tintIndex = bConfig.colorBag.shift();
    applyTint(bConfig);

    // Only clickable if user continues making chaos
    el.addEventListener('mousedown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        triggerInsaneChaos(bConfig);
    });
    
    // Fun burst arrival if spawner creates it
    if(clickDelaySpawn) {
        el.animate([ { transform: `translate3d(${startX}px, ${startY}px, 0) scale(0)`, opacity: 0 },
                     { transform: `translate3d(${startX}px, ${startY}px, 0) scale(1)`, opacity: 1 } ], 
                   { duration: 400, easing: "ease-out" });
    }

    bulldogs.push(bConfig);
}


/* =========================================
   CRAZY CHAOS ON CLICK 
   ========================================= */

let shakeTimer = null;
const theErrorBox = document.querySelector('.error-content');

function triggerInsaneChaos(b) {
    // 1) Flash and Intense Chaos Shake via CSS rules mapped to body
    document.body.classList.remove('chaos-mode');
    void document.body.offsetWidth;
    document.body.classList.add('chaos-mode');

    clearTimeout(shakeTimer);
    shakeTimer = setTimeout(() => { document.body.classList.remove('chaos-mode'); }, 850);

    // 2) Shake up the original 404 box radically
    const spinVals = ["10deg", "-12deg", "25deg", "-15deg"];
    theErrorBox.style.transform = `scale(1.08) rotate(${spinVals[Math.floor(Math.random() * spinVals.length)]})`;
    setTimeout(() => { theErrorBox.style.transform = ""; }, 500);

    // 3) Visually explode and glitch the bulldog that was actually clicked
    b.el.animate([
        { transform: `translate3d(${b.x}px, ${b.y}px, 0) scale(1) rotate(0)` },
        { transform: `translate3d(${b.x}px, ${b.y}px, 0) scale(3.5) rotate(720deg)`, filter: 'saturate(4) invert(1)' },
        { transform: `translate3d(${b.x}px, ${b.y}px, 0) scale(1) rotate(0)` }
    ], { duration: 600, easing: 'cubic-bezier(0.175, 0.885, 0.32, 1.275)' });

    // 4) Shake OUT the bulldog: Drop completely chaotic hyperactive new mini dogs!
    const clonesAmount = Math.floor(Math.random() * 4) + 4; // Between 4 to 7
    for (let i = 0; i < clonesAmount; i++) {
        // High, reckless and totally arbitrary explosive velocities
        let superSpeedX = (Math.random() > 0.5 ? 1 : -1) * (2.8 + (Math.random() * 4.0));
        let superSpeedY = (Math.random() > 0.5 ? 1 : -1) * (2.8 + (Math.random() * 4.0));
        
        spawnBulldog(b.x, b.y, superSpeedX, superSpeedY, true);
    }
}


/* =========================================
   ENGINE ANIMATION TICK 
   ========================================= */

let lastTime = performance.now();

function animateBulldogs(currentTime) {
    // Math handles variable tick frames! Delta is clamped to prevent hyperspace jumps
    const delta = Math.min((currentTime - lastTime) / 16.6667, 3);
    lastTime = currentTime;

    // Window borders
    const mX = Math.max(0, window.innerWidth);
    const mY = Math.max(0, window.innerHeight);

    for (let i = 0; i < bulldogs.length; i++) {
        let b = bulldogs[i];

        const boundX = mX - b.w;
        const boundY = mY - b.h;

        b.x += b.vx * delta;
        b.y += b.vy * delta;

        let collided = false;

        // X collision constraints 
        if (b.x <= 0) { b.x = 0; b.vx = Math.abs(b.vx); collided = true; }
        else if (b.x >= boundX) { b.x = boundX; b.vx = -Math.abs(b.vx); collided = true; }

        // Y collision constraints
        if (b.y <= 0) { b.y = 0; b.vy = Math.abs(b.vy); collided = true; }
        else if (b.y >= boundY) { b.y = boundY; b.vy = -Math.abs(b.vy); collided = true; }

        if (collided) {
            changeTint(b, currentTime);
        }

        b.el.style.transform = `translate3d(${b.x}px, ${b.y}px, 0)`;
    }

    requestAnimationFrame(animateBulldogs);
}


/* =========================================
   RESIZING & WINDOW MANAGEMENT 
   ========================================= */

window.addEventListener('resize', () => {
    const isMobile = window.innerWidth <= 600;
    const newSize = isMobile ? 68 : 92;

    for (let i = 0; i < bulldogs.length; i++) {
        let b = bulldogs[i];
        b.w = newSize; b.h = newSize;
        b.el.style.width = newSize + 'px';
        b.el.style.height = newSize + 'px';

        const maxX = Math.max(0, window.innerWidth - b.w);
        const maxY = Math.max(0, window.innerHeight - b.h);

        b.x = Math.max(0, Math.min(b.x, maxX));
        b.y = Math.max(0, Math.min(b.y, maxY));
    }
});


/* =========================================
   GENERATE FIRST SCENE 
   ========================================= */

// Single start velocity based entirely heavily on randomness 
const startSize = window.innerWidth <= 600 ? 68 : 92;

let initX = Math.random() * Math.max(1, window.innerWidth - startSize);
let initY = Math.random() * Math.max(1, window.innerHeight - startSize);

let initSpeedX = (Math.random() > 0.5 ? 1 : -1) * (2.10 + Math.random() * 0.90);
let initSpeedY = (Math.random() > 0.5 ? 1 : -1) * (2.00 + Math.random() * 0.80);

// Kickstart Original Dog First 
spawnBulldog(initX, initY, initSpeedX, initSpeedY, false);
requestAnimationFrame(animateBulldogs);

</script>
</body>
