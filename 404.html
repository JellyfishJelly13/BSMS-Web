<div id="offlineBanner">

 id="dvdLogo"

 alt=""

<main class="error-content">

```
<h1 class="error-code">

<script>

/* =========================================
   OFFLINE STATUS
   ========================================= */

const offlineBanner =
    document.getElementById('offlineBanner');

window.addEventListener('offline', () => {
    offlineBanner.classList.add('show');
});

window.addEventListener('online', () => {
    offlineBanner.classList.remove('show');
});

if (!navigator.onLine) {
    offlineBanner.classList.add('show');
}


/* =========================================
   SESSION ID
   ========================================= */

if (!localStorage.getItem('session_id')) {

    const chars =
        'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

    let sid = '';

    for (let i = 0; i < 10; i++) {
        sid += chars.charAt(
            Math.floor(Math.random() * chars.length)
        );
    }

    localStorage.setItem('session_id', sid);

    console.log(
        '[BSMS Web :: System] Generated new session_id.'
    );
}


/* =========================================
   BULLDOG
   ========================================= */

const logo =
    document.getElementById('dvdLogo');


/* =========================================
   COLOR SYSTEM
   =========================================

   There are exactly 7 colors:

   0 = Red
   1 = Orange
   2 = Yellow
   3 = Green
   4 = Blue
   5 = Purple
   6 = Pink

   The Bulldog must use EVERY color in the
   current cycle before any color is allowed
   to appear again.

   This prevents things like:

   Red → Green → Red

   and guarantees that Orange and Yellow
   actually get their turn.
   ========================================= */

const tints = [

    /* RED */
    `saturate(1.18)
     contrast(1.04)
     hue-rotate(0deg)
     drop-shadow(0 0 8px rgba(187, 0, 30, .40))
     drop-shadow(0 0 18px rgba(187, 0, 30, .16))`,

    /* ORANGE */
    `saturate(1.20)
     contrast(1.04)
     hue-rotate(18deg)
     drop-shadow(0 0 8px rgba(255, 125, 35, .42))
     drop-shadow(0 0 18px rgba(255, 125, 35, .16))`,

    /* YELLOW */
    `saturate(1.20)
     contrast(1.04)
     hue-rotate(38deg)
     drop-shadow(0 0 8px rgba(255, 210, 40, .42))
     drop-shadow(0 0 18px rgba(255, 210, 40, .16))`,

    /* GREEN */
    `saturate(1.18)
     contrast(1.04)
     hue-rotate(85deg)
     drop-shadow(0 0 8px rgba(45, 205, 100, .40))
     drop-shadow(0 0 18px rgba(45, 205, 100, .15))`,

    /* BLUE */
    `saturate(1.20)
     contrast(1.04)
     hue-rotate(175deg)
     drop-shadow(0 0 8px rgba(40, 115, 255, .42))
     drop-shadow(0 0 18px rgba(40, 115, 255, .16))`,

    /* PURPLE */
    `saturate(1.20)
     contrast(1.04)
     hue-rotate(260deg)
     drop-shadow(0 0 8px rgba(165, 70, 255, .42))
     drop-shadow(0 0 18px rgba(165, 70, 255, .16))`,

    /* PINK */
    `saturate(1.20)
     contrast(1.04)
     hue-rotate(315deg)
     drop-shadow(0 0 8px rgba(255, 70, 160, .42))
     drop-shadow(0 0 18px rgba(255, 70, 160, .16))`
];


/*
   The first cycle is shuffled so the page
   doesn't always start red → orange → yellow.

   After every color has been used, a new
   cycle is generated.
*/

let colorBag = [];


/* Create a randomized bag containing all
   seven colors exactly once. */
function createColorBag() {

    const bag = [
        0, // red
        1, // orange
        2, // yellow
        3, // green
        4, // blue
        5, // purple
        6  // pink
    ];

    /*
       Fisher-Yates shuffle.
    */

    for (let i = bag.length - 1; i > 0; i--) {

        const randomIndex =
            Math.floor(Math.random() * (i + 1));

        [
            bag[i],
            bag[randomIndex]
        ] = [
            bag[randomIndex],
            bag[i]
        ];
    }

    return bag;
}


/* Start with a shuffled color cycle. */
colorBag = createColorBag();


/*
   Current color.
*/
let tintIndex = colorBag.shift();


/*
   Prevent rapid flashing.

   Even if the Bulldog hits another edge
   immediately after a corner collision,
   the color cannot change more than once
   every 450 milliseconds.
*/
const COLOR_CHANGE_COOLDOWN = 450;

let lastColorChange =
    performance.now() - COLOR_CHANGE_COOLDOWN;


/* Apply current color. */
function applyTint() {

    logo.style.filter =
        tints[tintIndex];
}


/*
   Change to the next color.

   IMPORTANT:

   We DO NOT randomly choose a color here.

   Instead, we pull colors from the shuffled
   bag. Therefore:

   Red
   → Green
   → Pink
   → Yellow
   → Blue
   → Orange
   → Purple
   → ...

   A color cannot repeat until all six
   other colors have appeared.
*/
function changeTint(currentTime) {

    /*
       Ignore collisions that happen too soon
       after the previous color change.
    */
    if (
        currentTime - lastColorChange
        < COLOR_CHANGE_COOLDOWN
    ) {
        return;
    }


    /*
       If the current color cycle is empty,
       create an entirely new randomized cycle.
    */
    if (colorBag.length === 0) {
        colorBag = createColorBag();
    }


    /*
       Take the next color from the bag.
    */
    tintIndex =
        colorBag.shift();


    /*
       Apply it.
    */
    applyTint();


    /*
       Remember exactly when the change happened.
    */
    lastColorChange =
        currentTime;
}


/* =========================================
   CLICK → INSANE SHAKE
   ========================================= */

let shakeTimer = null;

logo.addEventListener('click', () => {

    /*
       Restart the shake even if the Bulldog
       gets clicked while already shaking.
    */

    document.body.classList.remove('shaking');

    void document.body.offsetWidth;

    document.body.classList.add('shaking');


    clearTimeout(shakeTimer);

    shakeTimer = setTimeout(() => {

        document.body.classList.remove('shaking');

    }, 1000);
});


/* =========================================
   BOUNCING PHYSICS
   ========================================= */

let x = 100;
let y = 100;


/*
   2× speed from the original version.
*/
let velocityX = 2.50;
let velocityY = 2.16;


let logoWidth = 92;
let logoHeight = 92;


let lastTime =
    performance.now();


/* =========================================
   RESPONSIVE LOGO SIZE
   ========================================= */

function updateLogoSize() {

    const mobile =
        window.innerWidth <= 600;

    logoWidth =
        mobile ? 68 : 92;

    logoHeight =
        mobile ? 68 : 92;

    logo.style.width =
        logoWidth + 'px';

    logo.style.height =
        logoHeight + 'px';
}


/* =========================================
   KEEP LOGO ON SCREEN
   ========================================= */

function keepLogoInsideScreen() {

    const maxX =
        Math.max(
            0,
            window.innerWidth - logoWidth
        );

    const maxY =
        Math.max(
            0,
            window.innerHeight - logoHeight
        );

    x =
        Math.max(
            0,
            Math.min(x, maxX)
        );

    y =
        Math.max(
            0,
            Math.min(y, maxY)
        );
}


/* =========================================
   ANIMATION
   ========================================= */

function animateLogo(currentTime) {

    /*
       Convert elapsed milliseconds into a
       roughly 60 FPS movement multiplier.
    */

    const delta =
        Math.min(
            (currentTime - lastTime) / 16.6667,
            2
        );

    lastTime =
        currentTime;


    const maxX =
        Math.max(
            0,
            window.innerWidth - logoWidth
        );

    const maxY =
        Math.max(
            0,
            window.innerHeight - logoHeight
        );


    /*
       Move the Bulldog.
    */

    x +=
        velocityX * delta;

    y +=
        velocityY * delta;


    /*
       IMPORTANT:

       One collision can trigger multiple
       boundary checks at a corner.

       We intentionally use ONE `collided`
       boolean so a corner can only request
       ONE color change.
    */

    let collided = false;


    /* LEFT WALL */

    if (x <= 0) {

        x = 0;

        velocityX =
            Math.abs(velocityX);

        collided = true;
    }


    /* RIGHT WALL */

    if (x >= maxX) {

        x = maxX;

        velocityX =
            -Math.abs(velocityX);

        collided = true;
    }


    /* TOP WALL */

    if (y <= 0) {

        y = 0;

        velocityY =
            Math.abs(velocityY);

        collided = true;
    }


    /* BOTTOM WALL */

    if (y >= maxY) {

        y = maxY;

        velocityY =
            -Math.abs(velocityY);

        collided = true;
    }


    /*
       ONE color change maximum per frame,
       with the 450ms cooldown enforced inside
       changeTint().
    */

    if (collided) {
        changeTint(currentTime);
    }


    /*
       Draw Bulldog.
    */

    logo.style.transform =
        `translate3d(${x}px, ${y}px, 0)`;


    requestAnimationFrame(
        animateLogo
    );
}


/* =========================================
   START
   ========================================= */

window.addEventListener(
    'resize',
    () => {

        updateLogoSize();

        keepLogoInsideScreen();

    }
);


updateLogoSize();


/*
   Random starting position.
*/

x =
    Math.random() *
    Math.max(
        1,
        window.innerWidth - logoWidth
    );

y =
    Math.random() *
    Math.max(
        1,
        window.innerHeight - logoHeight
    );


/*
   Random starting direction and 2× speed.
*/

velocityX =
    (Math.random() > 0.5 ? 1 : -1) *
    (2.10 + Math.random() * 0.90);

velocityY =
    (Math.random() > 0.5 ? 1 : -1) *
    (2.00 + Math.random() * 0.80);


/*
   Apply initial randomized color.
*/

applyTint();


/*
   Start animation.
*/

requestAnimationFrame(
    animateLogo
);

</script>
