<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>404 - Page Not Found</title>

<!-- Favicons -->
<link rel="icon" href="/img/icon.png">
<link rel="apple-touch-icon" href="/img/app-icon.png">

<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2TKPQV995W"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-2TKPQV995W');
</script>
<script src="/analytics.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');

*,*::before,*::after{
  box-sizing:border-box;
}

:root{
  --red:#BB001E;
  --red-h:#d10022;
  --red-glow:rgba(187,0,30,0.35);
  --font:'Patrick Hand',cursive;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:var(--font);
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

/* Offline Banner */
#offlineBanner {
  position: fixed; top: 0; left: 0; width: 100%; background: #ef4444; color: #fff;
  text-align: center; padding: 10px; font-family: var(--font); font-size: 18px;
  z-index: 10000; transform: translateY(-100%); transition: transform 0.3s ease;
}
#offlineBanner.show { transform: translateY(0); }

/* animations */
@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

@keyframes popIn{
  from{
    opacity:0;
    transform:scale(.92) translateY(14px);
  }
  to{
    opacity:1;
    transform:scale(1) translateY(0);
  }
}

/* CARD */
.card{
  width:min(560px,100%);
  background:rgba(0,0,0,0.97);
  border:3px solid var(--red);
  border-radius:28px;
  padding:40px 30px;
  text-align:center;
  animation:fadeIn .25s ease, popIn .3s ease;
}

.error-code{
  font-size:120px;
  line-height:1;
  margin:0;
  color:var(--red);
  text-shadow:0 0 35px rgba(187,0,30,0.55);
}

.title{
  font-size:42px;
  margin:10px 0 12px;
}

.desc{
  font-size:22px;
  color:rgba(255,255,255,0.65);
  line-height:1.5;
  margin:0;
}

.btn {
  display: inline-block; font-family: var(--font); font-size: 19px;
  padding: 10px 18px; border-radius: 12px; border: 2px solid var(--red);
  background: var(--red); color: #fff; cursor: pointer;
  transition: transform .15s, background .15s, box-shadow .15s, border-color .15s;
  text-decoration: none; text-align: center; line-height: 1.2; width: auto;
  margin-top: 24px;
}
.btn:hover { background: var(--red-h); transform: scale(1.03); box-shadow: 0 4px 18px var(--red-glow); }
.btn:active { transform: scale(.97); }

@media(max-width:600px){
  .error-code{font-size:90px;}
  .title{font-size:34px;}
  .desc{font-size:19px;}
}
</style>
</head>

<body>

<div id="offlineBanner">You are currently offline</div>

<div class="card">
  <h1 class="error-code">404</h1>

  <div class="title">Page Not Found</div>

  <p class="desc">
    The page you are looking for does<br>
    not exist or may have been removed.
  </p>
  
  <a href="/" class="btn" data-ga="404_home_btn">Go Back Home</a>
</div>

<script>
/*
 * BSMS Web
 * Copyright © 2026 Jellyfish Jelly
 * SPDX-License-Identifier: MIT
 */
window.addEventListener('offline', () => document.getElementById('offlineBanner').classList.add('show'));
window.addEventListener('online', () => document.getElementById('offlineBanner').classList.remove('show'));
if (!navigator.onLine) document.getElementById('offlineBanner').classList.add('show');

if (!localStorage.getItem('session_id')) {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    let sid = '';
    for (let i = 0; i < 10; i++) sid += chars.charAt(Math.floor(Math.random() * chars.length));
    localStorage.setItem('session_id', sid);
    console.log("[BSMS Web :: System] Generated new session_id.");
}
</script>

</body>
</html>
