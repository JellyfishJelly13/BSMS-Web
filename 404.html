<link rel="apple-touch-icon" href="/img/app-icon.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');

*, *::before, *::after {
    box-sizing: border-box;
}

:root {
    --red: #BB001E;
    --red-bright: #e00025;
    --font: 'Patrick Hand', cursive;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;

    overflow: hidden;

    background: #000;
    color: #fff;

    font-family: var(--font);
}

body {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            rgba(187, 0, 30, 0.065) 0%,
            rgba(187, 0, 30, 0.02) 35%,
            transparent 70%
        ),
        #000;
}

/* =========================================================
   OFFLINE BANNER
========================================================= */

#offlineBanner {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    padding: 10px 16px;

    background: #ef4444;
    color: #fff;

    text-align: center;

    font-family: var(--font);
    font-size: 18px;

    z-index: 10000;

    transform: translateY(-100%);

    transition: transform 0.3s ease;
}

#offlineBanner.show {
    transform: translateY(0);
}

/* =========================================================
   PAGE CONTENT
========================================================= */

.error-content {
    position: relative;

    z-index: 5;

    width: min(700px, 90vw);

    text-align: center;

    pointer-events: none;

    animation:
        contentFadeIn 0.55s ease both;
}

/* =========================================================
   404
========================================================= */

.error-code {
    margin: 0;

    font-size: clamp(105px, 16vw, 170px);

    line-height: 0.8;

    letter-spacing: -6px;

    color: var(--red);

    text-shadow:
        0 0 14px rgba(187, 0, 30, 0.35),
        0 0 38px rgba(187, 0, 30, 0.2);
}

/* =========================================================
   TITLE
========================================================= */

.title {
    margin-top: 25px;

    font-size: clamp(34px, 5vw, 48px);

    line-height: 1.05;

    color: #fff;

    text-shadow:
        0 2px 18px rgba(0, 0, 0, 0.75);
}

/* =========================================================
   DESCRIPTION
========================================================= */

.desc {
    max-width: 500px;

    margin: 14px auto 0;

    color: rgba(255, 255, 255, 0.58);

    font-size: clamp(18px, 2.5vw, 21px);

    line-height: 1.45;

    text-shadow:
        0 2px 14px rgba(0, 0, 0, 0.9);
}

/* =========================================================
   BUTTON
========================================================= */

.btn {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    margin-top: 27px;

    min-height: 46px;

    padding: 10px 23px;

    border: 1px solid var(--red);

    border-radius: 12px;

    background: rgba(187, 0, 30, 0.9);

    color: #fff;

    font-family: var(--font);
    font-size: 20px;

    line-height: 1;

    text-decoration: none;

    pointer-events: auto;

    box-shadow:
        0 7px 25px rgba(187, 0, 30, 0.2);

    transition:
        transform 0.16s ease,
        background 0.16s ease,
        box-shadow 0.16s ease;
}

.btn:hover {
    background: var(--red-bright);

    transform: translateY(-2px);

    box-shadow:
        0 10px 30px rgba(187, 0, 30, 0.4);
}

.btn:active {
    transform: scale(0.97);
}

/* =========================================================
   BOUNCING BULLDOG
========================================================= */

#dvdLogo {
    position: fixed;

    top: 0;
    left: 0;

    width: 92px;
    height: 92px;

    object-fit: contain;

    /*
     * ABOVE EVERYTHING.
     */
    z-index: 20;

    pointer-events: none;
    user-select: none;

    will-change: transform, filter;

    /*
     * Start with the Bulldog's ORIGINAL appearance.
     * Only a very subtle tint is applied.
     */
    filter:
        saturate(1.12)
        contrast(1.03)
        drop-shadow(0 0 7px rgba(187, 0, 30, 0.28))
        drop-shadow(0 0 16px rgba(187, 0, 30, 0.12));

    transition:
        filter 0.18s ease;
}

/* =========================================================
   ANIMATION
========================================================= */

@keyframes contentFadeIn {

    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    #dvdLogo {
        width: 68px;
        height: 68px;
    }

    .error-code {
        letter-spacing: -4px;
    }

    .title {
        margin-top: 20px;
    }

    .desc {
        max-width: 380px;
    }

    .btn {
        margin-top: 23px;
    }
}

/* =========================================================
   SHORT SCREENS
========================================================= */

@media (max-height: 600px) {

    .error-code {
        font-size: 90px;
    }

    .title {
        margin-top: 17px;
        font-size: 32px;
    }

    .desc {
        margin-top: 9px;
        font-size: 17px;
    }

    .btn {
        margin-top: 17px;
    }
}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    .error-content {
        animation: none;
    }

    #dvdLogo {
        transition: none;
    }

    .btn {
        transition: none;
    }
}
</style>

</head>

<body>

<!-- =======================================================
     OFFLINE BANNER
======================================================= -->

<div id="offlineBanner">
    You are currently offline
</div>

<!-- =======================================================
     BOUNCING BULLDOG
======================================================= -->

<img
 id="dvdLogo"
 src="/img/icon.png"
 alt=""
 aria-hidden="true"
/>

<!-- =======================================================
     404 CONTENT
======================================================= -->

<main class="error-content">


<h1 class="error-code">
    404
</h1>

<div class="title">
    Page Not Found
</div>

<p class="desc">
    The page you're looking for doesn't exist,
    or it may have been moved or removed.
</p>

<a
    href="/"
    class="btn"
    data-ga="404_home_btn"
>
    Go Back Home
</a>


</main>

<script>
/*
 * BSMS Web
 * Copyright © 2026 Jellyfish Jelly
 * SPDX-License-Identifier: MIT
 */

/* =========================================================
   OFFLINE STATUS
========================================================= */

const offlineBanner =
    document.getElementById('offlineBanner');

window.addEventListener('offline', () => {
    offlineBanner.classList.add('show');
});

window.addEventListener('online', () => {
    offlineBanner.classList.remove('show');
});

if (!navigator.onLine) {
    offlineBanner.classList.add('show');
}


/* =========================================================
   SESSION ID
========================================================= */

if (!localStorage.getItem('session_id')) {

    const chars =
        'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

    let sid = '';

    for (let i = 0; i < 10; i++) {
        sid += chars.charAt(
            Math.floor(Math.random() * chars.length)
        );
    }

    localStorage.setItem('session_id', sid);

    console.log(
        '[BSMS Web :: System] Generated new session_id.'
    );
}


/* =========================================================
   BULLDOG
========================================================= */

const logo =
    document.getElementById('dvdLogo');


/*
 * These are SUBTLE tint values.
 *
 * The Bulldog itself remains visible and retains its
 * original image details. We are NOT converting the
 * image to a solid color.
 */
const tints = [

    /*
     * Red
     */
    {
        filter:
            `
            saturate(1.18)
            contrast(1.04)
            hue-rotate(0deg)
            drop-shadow(0 0 8px rgba(187, 0, 30, 0.38))
            drop-shadow(0 0 18px rgba(187, 0, 30, 0.16))
            `
    },

    /*
     * Blue
     */
    {
        filter:
            `
            saturate(1.22)
            contrast(1.04)
            hue-rotate(175deg)
            drop-shadow(0 0 8px rgba(40, 115, 255, 0.4))
            drop-shadow(0 0 18px rgba(40, 115, 255, 0.16))
            `
    },

    /*
     * Green
     */
    {
        filter:
            `
            saturate(1.18)
            contrast(1.04)
            hue-rotate(85deg)
            drop-shadow(0 0 8px rgba(45, 205, 100, 0.38))
            drop-shadow(0 0 18px rgba(45, 205, 100, 0.15))
            `
    },

    /*
     * Yellow
     */
    {
        filter:
            `
            saturate(1.22)
            contrast(1.04)
            hue-rotate(38deg)
            drop-shadow(0 0 8px rgba(255, 210, 40, 0.4))
            drop-shadow(0 0 18px rgba(255, 210, 40, 0.16))
            `
    },

    /*
     * Purple
     */
    {
        filter:
            `
            saturate(1.2)
            contrast(1.04)
            hue-rotate(260deg)
            drop-shadow(0 0 8px rgba(165, 70, 255, 0.4))
            drop-shadow(0 0 18px rgba(165, 70, 255, 0.16))
            `
    },

    /*
     * Cyan
     */
    {
        filter:
            `
            saturate(1.2)
            contrast(1.04)
            hue-rotate(150deg)
            drop-shadow(0 0 8px rgba(40, 220, 220, 0.4))
            drop-shadow(0 0 18px rgba(40, 220, 220, 0.16))
            `
    },

    /*
     * Orange
     */
    {
        filter:
            `
            saturate(1.18)
            contrast(1.04)
            hue-rotate(18deg)
            drop-shadow(0 0 8px rgba(255, 125, 35, 0.4))
            drop-shadow(0 0 18px rgba(255, 125, 35, 0.16))
            `
    },

    /*
     * Pink
     */
    {
        filter:
            `
            saturate(1.2)
            contrast(1.04)
            hue-rotate(315deg)
            drop-shadow(0 0 8px rgba(255, 70, 160, 0.4))
            drop-shadow(0 0 18px rgba(255, 70, 160, 0.16))
            `
    }
];


let tintIndex = 0;


/* =========================================================
   APPLY TINT
========================================================= */

function applyTint() {

    logo.style.filter =
        tints[tintIndex].filter;
}


/* =========================================================
   CHANGE TINT
========================================================= */

function changeTint() {

    let next;

    do {

        next =
            Math.floor(
                Math.random() * tints.length
            );

    } while (
        next === tintIndex &&
        tints.length > 1
    );

    tintIndex = next;

    applyTint();
}


/* =========================================================
   POSITION
========================================================= */

let x = 100;
let y = 100;

let velocityX = 1.25;
let velocityY = 1.08;

let logoWidth = 92;
let logoHeight = 92;

let lastTime =
    performance.now();


/* =========================================================
   LOGO SIZE
========================================================= */

function updateLogoSize() {

    const mobile =
        window.innerWidth <= 600;

    logoWidth =
        mobile ? 68 : 92;

    logoHeight =
        mobile ? 68 : 92;

    logo.style.width =
        logoWidth + 'px';

    logo.style.height =
        logoHeight + 'px';
}


/* =========================================================
   KEEP INSIDE SCREEN
========================================================= */

function keepLogoInsideScreen() {

    const maxX =
        Math.max(
            0,
            window.innerWidth - logoWidth
        );

    const maxY =
        Math.max(
            0,
            window.innerHeight - logoHeight
        );

    x =
        Math.max(
            0,
            Math.min(x, maxX)
        );

    y =
        Math.max(
            0,
            Math.min(y, maxY)
        );
}


/* =========================================================
   BOUNCING ANIMATION
========================================================= */

function animateLogo(currentTime) {

    const delta =
        Math.min(
            (currentTime - lastTime) / 16.6667,
            2
        );

    lastTime =
        currentTime;


    const maxX =
        Math.max(
            0,
            window.innerWidth - logoWidth
        );

    const maxY =
        Math.max(
            0,
            window.innerHeight - logoHeight
        );


    x += velocityX * delta;
    y += velocityY * delta;


    let collided = false;


    /* LEFT */

    if (x <= 0) {

        x = 0;

        velocityX =
            Math.abs(velocityX);

        collided = true;
    }


    /* RIGHT */

    if (x >= maxX) {

        x = maxX;

        velocityX =
            -Math.abs(velocityX);

        collided = true;
    }


    /* TOP */

    if (y <= 0) {

        y = 0;

        velocityY =
            Math.abs(velocityY);

        collided = true;
    }


    /* BOTTOM */

    if (y >= maxY) {

        y = maxY;

        velocityY =
            -Math.abs(velocityY);

        collided = true;
    }


    /*
     * Every wall collision gets a new tint.
     */
    if (collided) {
        changeTint();
    }


    logo.style.transform =
        `translate3d(${x}px, ${y}px, 0)`;


    requestAnimationFrame(
        animateLogo
    );
}


/* =========================================================
   WINDOW RESIZE
========================================================= */

window.addEventListener('resize', () => {

    updateLogoSize();

    keepLogoInsideScreen();

});


/* =========================================================
   INITIALIZE
========================================================= */

updateLogoSize();


/*
 * Random starting position.
 */

x =
    Math.random() *
    Math.max(
        1,
        window.innerWidth - logoWidth
    );

y =
    Math.random() *
    Math.max(
        1,
        window.innerHeight - logoHeight
    );


/*
 * Random starting direction.
 */

velocityX =
    (Math.random() > 0.5 ? 1 : -1) *
    (1.05 + Math.random() * 0.45);

velocityY =
    (Math.random() > 0.5 ? 1 : -1) *
    (0.95 + Math.random() * 0.45);


/*
 * Initial Bulldog appearance.
 */

applyTint();


/*
 * Start the DVD animation.
 */

requestAnimationFrame(
    animateLogo
);
</script>

</body>
</html>
