<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSMS Admin Console</title>
<style>
    :root {
        --bg: #0f172a; --bg-surface: #1e293b; --bg-hover: #334155;
        --border: #475569; --text: #f8fafc; --text-muted: #94a3b8;
        --accent: #3b82f6; --danger: #ef4444; --success: #22c55e;
        --font-mono: 'Courier New', Courier, monospace;
        --font-sans: system-ui, -apple-system, sans-serif;
    }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); display: flex; height: 100vh; overflow: hidden; }
    #sidebar { width: 250px; background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .nav-btn { padding: 15px 20px; background: transparent; border: none; color: var(--text-muted); text-align: left; font-size: 14px; cursor: pointer; border-bottom: 1px solid var(--border); }
    .nav-btn:hover, .nav-btn.active { background: var(--bg-hover); color: var(--text); }
    
    #main { flex: 1; overflow-y: auto; padding: 20px; }
    .panel { display: none; }
    .panel.active { display: block; }
    h1 { margin-top: 0; font-size: 24px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
    
    /* Tables */
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 20px; }
    th, td { padding: 10px; border: 1px solid var(--border); text-align: left; }
    th { background: var(--bg-surface); color: var(--text-muted); font-weight: normal; }
    td { font-family: var(--font-mono); }
    
    /* Forms & Buttons */
    input, select, button, textarea { font-family: var(--font-mono); background: #000; color: #fff; border: 1px solid var(--border); padding: 8px; border-radius: 4px; }
    input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); }
    button { cursor: pointer; background: var(--bg-surface); }
    button:hover { background: var(--bg-hover); }
    button.primary { background: var(--accent); border-color: var(--accent); }
    button.danger { background: var(--danger); border-color: var(--danger); }
    
    /* Modals */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-overlay.show { display: flex; }
    .modal { background: var(--bg-surface); border: 1px solid var(--border); padding: 20px; width: 500px; max-height: 90vh; overflow-y: auto; border-radius: 6px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 12px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; box-sizing: border-box; }
    
    /* DB Editor Tree */
    .tree-node { margin-left: 20px; border-left: 1px dashed var(--border); padding-left: 10px; }
    .tree-key { color: var(--accent); cursor: pointer; font-weight: bold; }
    .tree-val { color: var(--success); }
    .tree-val.string { color: #f59e0b; }
    .tree-val.boolean { color: #d946ef; }
    .edit-icn { cursor: pointer; color: var(--text-muted); font-size: 12px; margin-left: 8px; text-decoration: underline; }
</style>
</head>
<body>

<div id="sidebar">
    <div style="padding: 20px; font-weight: bold; font-family: var(--font-mono); border-bottom: 1px solid var(--border);">BSMS_ADMIN</div>
    <button class="nav-btn active" onclick="Admin.switchTab('users')">User Management</button>
    <button class="nav-btn" onclick="Admin.switchTab('db')">Raw DB Editor</button>
</div>

<div id="main">
    <!-- User Management Panel -->
    <div id="users-panel" class="panel active">
        <h1>Account Registry</h1>
        <table id="users-table">
            <thead>
                <tr>
                    <th>UID</th><th>Username</th><th>Display Name</th><th>Role</th><th>Status</th><th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- DB Editor Panel -->
    <div id="db-panel" class="panel">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); margin-bottom: 10px; padding-bottom: 10px;">
            <h1 style="border:none; margin:0; padding:0;">Realtime Database Inspector</h1>
            <button onclick="Admin.loadDB()">Refresh Data</button>
        </div>
        <div id="db-tree" style="font-family: var(--font-mono); font-size: 13px; background: #000; padding: 15px; border-radius: 6px; overflow-x: auto;"></div>
    </div>
</div>

<!-- User Edit Modal -->
<div id="edit-modal" class="modal-overlay">
    <div class="modal">
        <h2 style="margin-top:0;">Edit Account: <span id="em-uid" style="color:var(--accent);"></span></h2>
        
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="em-username">
        </div>
        <div class="form-group">
            <label>Display Name</label>
            <input type="text" id="em-displayname">
        </div>
        <div class="form-group">
            <label>Bio</label>
            <textarea id="em-bio" rows="3"></textarea>
        </div>
        <div class="form-group" style="display:flex; gap: 10px; align-items:flex-end;">
            <div style="flex:1;">
                <label>Avatar / PFP</label>
                <input type="text" id="em-avatar" disabled placeholder="Base64 or URL">
            </div>
            <button class="danger" onclick="Admin.clearAvatar()">Clear Avatar</button>
        </div>
        <div class="form-group">
            <label>Password (Stored Securely)</label>
            <input type="text" value="******** (Encrypted)" disabled style="color:var(--text-muted);">
            <button style="margin-top:5px; width:100%;">Trigger Password Reset</button>
        </div>

        <h3 style="border-bottom: 1px solid var(--border); padding-bottom: 5px; margin-top:30px;">Access Controls</h3>
        <div class="form-group">
            <label>Account Status</label>
            <select id="em-status">
                <option value="active">Active</option>
                <option value="banned">Banned</option>
                <option value="deleted">Deleted</option>
            </select>
        </div>
        <div class="form-group">
            <label>Ban Reason</label>
            <input type="text" id="em-banreason">
        </div>
        <div class="form-group">
            <label>Ban Expires (Timestamp MS)</label>
            <input type="number" id="em-banexpires" placeholder="Leave blank for permanent">
        </div>

        <h3 style="border-bottom: 1px solid var(--border); padding-bottom: 5px; margin-top:30px;">Device Management</h3>
        <div id="em-devices" style="margin-bottom: 20px;"></div>

        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button onclick="document.getElementById('edit-modal').classList.remove('show')">Cancel</button>
            <button class="primary" onclick="Admin.saveUser()">Save Changes</button>
        </div>
    </div>
</div>

<script src="admin/index.js"></script>
</body>
</html>
