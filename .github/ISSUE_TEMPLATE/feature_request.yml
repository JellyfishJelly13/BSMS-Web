name: Feature Request
description: Suggest a new feature or improvement for BSMS Web.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to BSMS Web!

        Tell us about your idea and why you think it would be useful.

  - type: textarea
    id: feature
    attributes:
      label: Feature description
      description: What would you like to see added or changed?
      placeholder: Describe your idea...
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why would this be useful?
      description: Explain how this feature would improve BSMS Web.
      placeholder: This would be useful because...
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Additional details
      description: If you have ideas about how this could work, describe them here.
      placeholder: Any additional ideas or details...
